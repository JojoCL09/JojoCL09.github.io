<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="my little pink world — a soft pastel pink personal blog."><title>blog · my little pink world</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Parisienne&family=Quicksand:wght@400;500;600&display=swap');
:root{--pink:#f6b7ca;--light:#fff7fa;--pale:#fde8ef;--deep:#a85d78;--text:#72535f;--line:#f2c6d4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#fffafb,#fdebf2);color:var(--text);font-family:Quicksand,sans-serif}
a{color:inherit;text-decoration:none}.top{padding:12px 7%;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.5px;background:#fff}
header{max-width:1180px;margin:auto;padding:42px 24px 25px;text-align:center;position:relative}.logo{font-family:Parisienne,cursive;font-size:68px;color:#e88eae;text-shadow:0 2px #fff,0 4px 12px #f3c5d4;margin:0}.tag{font-family:"DM Serif Display",serif;letter-spacing:4px;font-size:14px;margin:7px 0 28px;color:#916372}.bow{position:absolute;right:8%;top:55px;font-size:42px}

.grid{max-width:1180px;margin:20px auto 70px;padding:0 20px;display:grid;grid-template-columns:260px 1fr 240px;gap:22px}.card{background:#fffafa;border:1px solid var(--line);border-radius:16px;margin-bottom:20px;overflow:hidden;box-shadow:0 7px 25px #e8b9c522}.card h3{margin:0;padding:12px 17px;background:linear-gradient(90deg,#fde1ea,#fff8fb);font-family:"DM Serif Display",serif;font-weight:400;color:#9b5c71;font-size:20px}.pad{padding:17px;line-height:1.7;font-size:14px}.avatar{height:190px;background:linear-gradient(135deg,#f6d4df,#fff);display:flex;align-items:center;justify-content:center;font-size:75px}
.post{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:20px}.date{display:inline-block;background:var(--pale);border-radius:10px;padding:8px 12px;font-size:12px;color:#a45a75;margin-bottom:12px}.post h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:30px;color:#875467;margin:0 0 13px}.photo{height:190px;border-radius:12px;background:linear-gradient(135deg,#f9dce6,#f4b9cd 50%,#fff1f5);display:flex;align-items:center;justify-content:center;font-size:65px;margin-bottom:14px}.btn{display:inline-block;margin-top:8px;padding:8px 15px;border:1px solid var(--pink);border-radius:18px;color:#a95373;background:#fff}.btn:hover{background:var(--pale)}ul{list-style:none;padding:0;margin:0}li{padding:5px 0}li:before{content:"♡ ";color:#e997b2}.quote{background:#fff0f5;padding:18px;border-radius:12px;text-align:center;font-family:"DM Serif Display",serif}.page{max-width:900px;margin:25px auto 70px;padding:0 20px}.page-title{text-align:center;font-family:"DM Serif Display",serif;font-size:38px;color:#91576d;font-weight:400}.page-sub{text-align:center;margin-bottom:28px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tile{height:190px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(135deg,#fde5ed,#fff);display:flex;align-items:center;justify-content:center;font-size:60px}.formbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.input,.textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--text);background:#fffafa}.textarea{height:110px;resize:vertical}.guest{background:#fff0f5;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}.guest b{color:#9b5c71}footer{text-align:center;padding:28px;border-top:1px solid var(--line);font-size:13px;background:#fff}
@media(max-width:980px){.grid{grid-template-columns:220px 1fr}.grid>aside:last-child{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid>aside:last-child .card{margin-bottom:0}}
@media(max-width:700px){.grid{grid-template-columns:1fr}.grid>aside:last-child{display:block}.grid>aside:last-child .card{margin-bottom:20px}.logo{font-size:50px}.bow{display:none}.gallery{grid-template-columns:1fr 1fr}}

<div class="top">♡ welcome to my little pink world ♡</div>
<header>
<div class="bow">🎀</div>
<h1 class="logo">my little pink world ♡</h1>
<div class="tag">life　♡　fashion　♡　dreams　♡　pretty things</div>
<nav class="nav">
<a href="index.html">⌂ Home</a>

</nav>
</header>
<main class="page"><h2 class="page-title">blog ♡</h2><p class="page-sub">little thoughts, pretty days & things i love</p>

<div id="dynamicPosts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async function(){
  if(!SUPABASE_URL.startsWith("https://") || SUPABASE_PUBLISHABLE_KEY.includes("PASTE-YOUR")) return;
  const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await client.from("posts").select("title,content,image_url,published_at").order("published_at",{ascending:false});
  if(error || !data?.length) return;
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
  document.getElementById("dynamicPosts").innerHTML=data.map(p=>{
    const d=new Date(p.published_at).toLocaleDateString(undefined,{month:"short",day:"numeric"});
    const photo=p.image_url ? `<img src="${esc(p.image_url)}" alt="" style="width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:14px">` : `<div class="photo">🎀　🩷　✨</div>`;
    return `<article class="post"><span class="date">${esc(d)}</span><h2>${esc(p.title)}</h2>${photo}<p>${esc(p.content).replace(/\n/g,"<br>")}</p></article>`;
  }).join("");
})();
</script>


</main><footer>made with ♡ & pink sparkles · my little pink world</footer></body></html>
